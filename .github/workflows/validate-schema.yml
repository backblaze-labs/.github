name: Validate schemas

# Validates every references*.yml (including schemas/references.example.yml)
# against schemas/references.schema.json, so the org-wide standard can never
# ship a broken schema or a non-conforming example.

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-schema.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-schema.yml"

# Least privilege: the job only checks out the repo and runs a local validator.
permissions:
  contents: read

concurrency:
  group: validate-schemas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate references schema
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7, reviewed 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
